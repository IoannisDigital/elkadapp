name: Build standalone app

# Χτίζει αυτόνομα εκτελέσιμα (χωρίς εγκατεστημένη Python) για
# Windows / macOS / Linux με PyInstaller και τα ανεβάζει ως artifacts.
# Σε push tag vX.Y.Z δημιουργείται και GitHub Release με τα αρχεία.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: GEMI-Elkad-Windows
          - os: macos-latest
            artifact: GEMI-Elkad-macOS
          - os: ubuntu-latest
            artifact: GEMI-Elkad-Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux GUI deps (tkinter)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build executable
        run: pyinstaller GEMI-Elkad.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/GEMI-Elkad
            dist/GEMI-Elkad.exe
            dist/GEMI-Elkad.app
          if-no-files-found: warn

      - name: Attach to release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/GEMI-Elkad
            dist/GEMI-Elkad.exe
